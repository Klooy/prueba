{# Enlace de un producto: WhatsApp arma la vista previa con su foto, su nombre y su precio. Espera `og` de product_share(). #}
  <meta name="description" content="{{ og.description }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ settings.store_name }}">
  <meta property="og:title" content="{{ og.title }}">
  <meta property="og:description" content="{{ og.description }}">
  <meta property="og:url" content="{{ og.url }}">
  <meta property="og:image" content="{{ og.image }}">
  <meta property="og:image:alt" content="{{ og.name }}">
