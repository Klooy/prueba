<svg class="emblem" viewBox="0 0 300 300" aria-hidden="true">
  <defs>
    <radialGradient id="em-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d27a" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#34d27a" stop-opacity=".06"/>
      <stop offset="1" stop-color="#34d27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="em-disk" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#173022"/>
      <stop offset=".7" stop-color="#0a120c"/>
      <stop offset="1" stop-color="#060906"/>
    </radialGradient>
    <linearGradient id="em-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#e8b84a"/><stop offset="1" stop-color="#8f6516"/>
    </linearGradient>
    <radialGradient id="em-fade" cx=".5" cy=".5" r=".5">
      <stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="em-mask" maskContentUnits="userSpaceOnUse"><circle cx="150" cy="150" r="103" fill="url(#em-fade)"/></mask>
  </defs>

  <circle cx="150" cy="150" r="148" fill="url(#em-aura)"/>

  <!-- disco solar -->
  <g class="spin">
    <circle cx="150" cy="150" r="128" fill="none" stroke="url(#em-gold)" stroke-width="1.2" opacity=".8"/>
    <circle cx="150" cy="150" r="119" fill="none" stroke="#34d27a" stroke-width=".8" stroke-dasharray="1.5 7" opacity=".6"/>
    <g fill="#e8b84a">
      <circle cx="150" cy="22" r="2.6"/><circle cx="278" cy="150" r="2.6"/>
      <circle cx="150" cy="278" r="2.6"/><circle cx="22" cy="150" r="2.6"/>
    </g>
  </g>
  <circle cx="150" cy="150" r="104" fill="url(#em-disk)" stroke="url(#em-gold)" stroke-width="1" stroke-opacity=".55"/>
  <circle cx="150" cy="150" r="98" fill="none" stroke="#e8b84a" stroke-width=".5" stroke-opacity=".25"/>


  <!-- ilustración de Anubis, fundida con el disco solar -->
  <image href="{{ url_for('static', filename='img/anubis.jpg') }}" x="44" y="40" width="212" height="212" mask="url(#em-mask)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="150" cy="150" r="104" fill="none" stroke="url(#em-gold)" stroke-width="1.2" stroke-opacity=".7"/>
</svg>
