<svg class="emblem" viewBox="0 0 300 300" aria-hidden="true">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".45" stop-color="#e9bc4a"/>
      <stop offset="1" stop-color="#8a6414"/>
    </linearGradient>
    <linearGradient id="g-leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dffb4"/>
      <stop offset=".5" stop-color="#3ddc6a"/>
      <stop offset="1" stop-color="#156b33"/>
    </linearGradient>
    <radialGradient id="g-aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3ddc6a" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#3ddc6a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#3ddc6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-smoke" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <circle cx="150" cy="150" r="148" fill="url(#g-aura)"/>

  <!-- disco solar -->
  <g class="spin">
    <circle cx="150" cy="150" r="128" fill="none" stroke="url(#g-gold)" stroke-width="1.5" opacity=".8"/>
    <circle cx="150" cy="150" r="118" fill="none" stroke="#3ddc6a" stroke-width="1" stroke-dasharray="2 9" opacity=".7"/>
    <g fill="#e9bc4a" opacity=".85">
      <circle cx="150" cy="22" r="3"/><circle cx="278" cy="150" r="3"/>
      <circle cx="150" cy="278" r="3"/><circle cx="22" cy="150" r="3"/>
    </g>
  </g>

  <!-- hoja sagrada -->
  <g class="halo">
    <use href="#leaf7" transform="translate(150 214) scale(2.15)" fill="url(#g-leaf)" filter="url(#f-glow)"/>
  </g>

  <!-- humo -->
  <g class="smoke" fill="none" stroke="#d9ffe3" stroke-linecap="round" filter="url(#f-smoke)">
    <path class="s1" d="M128 250 C110 220 146 200 126 170 C110 146 140 126 124 100" stroke-width="7"/>
    <path class="s2" d="M176 252 C196 224 160 204 182 176 C198 152 170 134 186 106" stroke-width="6"/>
    <path class="s3" d="M152 258 C140 236 166 222 150 196 C138 176 160 160 150 138" stroke-width="5"/>
  </g>

  <!-- Anubis -->
  <g transform="translate(51 54) scale(1.6)">
    <use href="#i-anubis" width="100" height="100" fill="url(#g-gold)" stroke="#2a1d05" stroke-width=".6"/>
    <path class="eye" d="M54 44 Q60 39.5 66 45 Q60 47.5 54 44 Z" fill="#9dffb4" filter="url(#f-glow)"/>
  </g>
</svg>
